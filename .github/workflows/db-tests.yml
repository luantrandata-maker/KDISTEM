name: Kiểm thử CSDL (RLS, cách ly dữ liệu)
on:
  push:
    paths: ['supabase/**', '.github/workflows/db-tests.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/db-tests.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ liệt kê migration sẽ chạy, không ghi vào CSDL'
        type: boolean
        default: true
      baseline_upto:
        description: 'Chỉ dùng MỘT lần: đánh dấu migration ≤ số này là "đã chạy" (vd 033), không chạy SQL nào. Để trống nếu không cần.'
        type: string
        default: ''
      schema_diff:
        description: 'So sánh cấu trúc CSDL thật với CSDL dựng từ repo (chỉ đọc). Bật thì KHÔNG chạy migration.'
        type: boolean
        default: false

jobs:
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      # Lượt 1: migration không có dữ liệu mẫu → CSDL sạch. Lượt 2: có dữ liệu mẫu → kiểm thử cách ly.
      - run: supabase/tests/run.sh lms_test

  # Chạy migration mới lên Supabase sau khi kiểm thử xanh trên main (hoặc bấm tay ở tab Actions).
  # Cần secret SUPABASE_DB_URL (chuỗi kết nối Session pooler). Không có secret → bỏ qua, không lỗi.
  # Không bật cờ app.seed_demo nên dữ liệu mẫu KHÔNG được chèn. Xem README mục "Chạy migration tự động".
  migrate:
    needs: isolation
    if: (github.event_name == 'workflow_dispatch' && !inputs.schema_diff) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: supabase-migrate, cancel-in-progress: false }
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      BASELINE_UPTO: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_upto || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        id: secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Chưa cấu hình secret SUPABASE_DB_URL — bỏ qua bước chạy migration."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secret.outputs.ok == 'true'
        with: { version: 2.121.0 }
      # CSDL đã chạy tay migration qua SQL Editor: ghi lịch sử để CLI không chạy lại từ 001.
      - name: Baseline lịch sử migration
        if: steps.secret.outputs.ok == 'true' && env.BASELINE_UPTO != ''
        run: |
          [[ "$BASELINE_UPTO" =~ ^[0-9]{3}$ ]] || { echo "::error::baseline_upto phải là 3 chữ số, vd 033"; exit 1; }
          V=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | awk -v m="$BASELINE_UPTO" '$1 <= m')
          echo "Đánh dấu đã chạy: $(echo $V)"
          supabase migration repair --db-url "$SUPABASE_DB_URL" --status applied $V --yes < /dev/null
      # Chặn: CSDL đã có bảng nghiệp vụ mà lịch sử migration không có bản ghi 001 (chưa có bảng, bảng rỗng,
      # hoặc chỉ có version lạ do công cụ khác ghi) → chạy tiếp sẽ chạy lại từ 001.
      - name: Kiểm tra đã baseline
        if: steps.secret.outputs.ok == 'true'
        run: |
          R=$(psql "$SUPABASE_DB_URL" -At -f supabase/scripts/baseline_guard.sql)
          echo "Kiểm tra baseline: $R"
          if [ "$R" != "ok" ]; then
            echo "::error::CSDL đã có dữ liệu nhưng chưa baseline lịch sử migration. Chạy workflow bằng tay với baseline_upto (xem README)."
            exit 1
          fi
      - name: Migration sẽ chạy
        if: steps.secret.outputs.ok == 'true'
        run: |
          OUT=$(supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --yes < /dev/null 2>&1); echo "$OUT"
          H=$(psql "$SUPABASE_DB_URL" -At -c "select count(*) || ' bản ghi, cuối: ' || coalesce(max(version), '-') from supabase_migrations.schema_migrations")
          P=$(echo "$OUT" | grep -oE '[0-9]+_[a-z0-9_]+\.sql' | sort -u | tr '\n' ' ')
          if [ -n "$P" ]; then echo "::notice title=migrate::Lịch sử: $H · sẽ chạy: $P"; else echo "::notice title=migrate::Lịch sử: $H · up to date (không có migration chờ)"; fi
      - name: Chạy migration
        if: steps.secret.outputs.ok == 'true' && env.DRY_RUN != 'true' && env.BASELINE_UPTO == ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes < /dev/null

  # Hàm máy chủ (supabase/functions): kiểm tra kiểu trên mọi PR/push.
  functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.1.4 }
      - run: for f in supabase/functions/*/index.ts; do deno check --node-modules-dir=none "$f"; done

  # Đưa hàm máy chủ lên Supabase sau khi migration đã chạy (hàm gọi các RPC của migration).
  # Cần secret SUPABASE_ACCESS_TOKEN (Personal access token của Supabase). Không có → bỏ qua, không lỗi.
  # Mã project lấy từ SUPABASE_DB_URL. Không kiểm JWT ở cổng (--no-verify-jwt): hàm tự kiểm quyền qua RPC bằng JWT người gọi.
  deploy-functions:
    needs: [migrate, functions-check]
    if: (github.event_name == 'workflow_dispatch' && !inputs.schema_diff && !inputs.dry_run && inputs.baseline_upto == '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: supabase-functions, cancel-in-progress: false }
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        id: secret
        run: |
          REF=$(printf '%s' "$SUPABASE_DB_URL" | sed -nE 's#.*://postgres\.([a-z0-9]{20})[:@].*#\1#p; s#.*@db\.([a-z0-9]{20})\.supabase\.co.*#\1#p' | head -1)
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::notice title=functions::Chưa có secret SUPABASE_ACCESS_TOKEN (hoặc không đọc được mã project từ SUPABASE_DB_URL) — bỏ qua bước đưa hàm máy chủ lên."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secret.outputs.ok == 'true'
        with: { version: 2.121.0 }
      - name: Đưa hàm máy chủ lên
        if: steps.secret.outputs.ok == 'true'
        run: |
          for d in supabase/functions/*/; do
            n=$(basename "$d")
            supabase functions deploy "$n" --project-ref "${{ steps.secret.outputs.ref }}" --no-verify-jwt --use-api < /dev/null
            echo "::notice title=functions::Đã đưa lên hàm $n"
          done

  # Chỉ đọc: so dấu vân tay cấu trúc (cột, hàm, policy, trigger, ràng buộc, chỉ mục, quyền mặc định)
  # của CSDL thật với CSDL dựng từ repo (không dữ liệu mẫu). Kết quả ở Summary của lần chạy + artifact schema-diff.
  schema-diff:
    if: github.event_name == 'workflow_dispatch' && inputs.schema_diff
    runs-on: ubuntu-latest
    permissions: { contents: write }
    environment: production
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Dựng CSDL từ repo (không dữ liệu mẫu)
        run: |
          psql -v ON_ERROR_STOP=1 -q -d postgres -c "create database repo"
          psql -v ON_ERROR_STOP=1 -q -d repo -f supabase/tests/auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -d repo -f "$f" > /dev/null; done
      - name: Lấy dấu vân tay hai CSDL
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Chưa có secret SUPABASE_DB_URL"; exit 1; }
          mkdir -p out
          psql -v ON_ERROR_STOP=1 -At -d repo -f supabase/scripts/schema_fingerprint.sql > out/repo.txt
          (unset PGHOST PGUSER PGPASSWORD; psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -f supabase/scripts/schema_fingerprint.sql) > out/live.txt
          # Nội dung đầy đủ hàm + policy để đọc chi tiết chỗ lệch
          psql -v ON_ERROR_STOP=1 -At -d repo -f supabase/scripts/schema_detail.sql > out/repo_detail.txt
          (unset PGHOST PGUSER PGPASSWORD; psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -f supabase/scripts/schema_detail.sql) > out/live_detail.txt
          # Dữ kiện tra cứu trên CSDL thật, trong giao dịch chỉ đọc
          (unset PGHOST PGUSER PGPASSWORD; psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c 'begin read only' -f supabase/scripts/live_facts.sql -c rollback) > out/facts.txt
          diff -u out/repo.txt out/live.txt > out/diff.txt || true
          wc -l out/*.txt
      - name: Tóm tắt
        run: |
          {
            echo "## So sánh cấu trúc: repo (−) và CSDL thật (+)"
            echo "repo: $(wc -l < out/repo.txt) dòng · CSDL thật: $(wc -l < out/live.txt) dòng"
            echo "Chỉ có trong repo: $(grep -c '^-[a-z]' out/diff.txt || true) · Chỉ có / khác ở CSDL thật: $(grep -c '^+[a-z]' out/diff.txt || true)"
            echo '```diff'; head -c 60000 out/diff.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Thông báo số chỗ lệch
        run: |
          echo "::notice title=schema-diff::repo $(wc -l < out/repo.txt) dòng · CSDL thật $(wc -l < out/live.txt) dòng · chỉ ở repo: $(grep -c '^-[a-z]' out/diff.txt || true) · chỉ ở/khác ở CSDL thật: $(grep -c '^+[a-z]' out/diff.txt || true) · chi tiết: nhánh ci/schema-diff"
      # Đẩy kết quả vào nhánh riêng ci/schema-diff (không merge vào main) để đọc được bằng git.
      - name: Đẩy kết quả vào nhánh ci/schema-diff
        run: |
          cp -r out /tmp/out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci/schema-diff
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/*.txt . && psql "$SUPABASE_DB_URL" -At -c "select version || ' ' || coalesce(name, '') from supabase_migrations.schema_migrations order by version" > history.txt
          git add -A && git commit -qm "schema-diff $(date -u +%Y-%m-%dT%H:%MZ) run ${{ github.run_id }}"
          git push -qf origin ci/schema-diff
      - uses: actions/upload-artifact@v4
        with: { name: schema-diff, path: out/ }
